  for(let k=nb-1;k>=0&&t-br[k].t<.15;k--)if(br[k].ball===i){if(!h||br[k].t>h.t)h=br[k];break}return h};
 for(let i=0;i<4;i++){const p=PP[i],h=lastHit(i),since=h?t-h.t:9,sq=since<.12?.08*Math.sin(Math.PI*since/.12):0;

  x.textAlign='left';x.lineJoin='round';x.font='900 28px "DejaVu Sans"';x.lineWidth=7;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(NAMES[i],cx0+50,y0+30);x.fillStyle=col(i,72);x.fillText(NAMES[i],cx0+50,y0+30);

 {const DUR=D.tmap.length/VF,FS=D.follows||1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const F=D.frames,k0=Math.max(0,F.length-110);let PY=0,bestd=-1;for(const cy of [D.BY0+130,(D.BY0+D.BY1)/2,D.BY1-120]){let dm=1e9;for(let k=k0;k<F.length;k++)dm=Math.min(dm,Math.abs(F[k][WIN][1]-cy));if(dm>bestd){bestd=dm;PY=cy}} /* pill row farthest from the winner ball over the pill window */

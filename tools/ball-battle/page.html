<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script><script>
// Family B "Ball battle" renderer (same account look as the ring-escape family: violet background, neon ring, glossy balls,
// top panel with hook + one truthful health row per ball). The HP number inside each ball and the bars are read from the sim frames.
const W=1080,H=1920,D=DATA,HUE=D.hue??305,BG=D.bg||['#2c1446','#130a2a','#05030c'],CX=D.CX,CY=D.CY,R=D.R,HT=D.HT,ET=D.endT,WIN=D.win,HP0=D.HP0,GAME=D.game||0,LW=D.lastWin??-1,SU=D.speedup||0;  // series test 1 (Game N + returning champion crown) and test 2 (SPEED +10% per knock-out), 9 Nov market scan
const NAMES=['RED','BLUE','YELLOW','GREEN'],HUES=[356,204,46,128],SAT=[95,95,100,80];
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};
const col=(i,l=58)=>`hsl(${HUES[i]},${SAT[i]}%,${i===2?Math.min(l+4,92):l}%)`;
const spd=D.events.filter(e=>e.type==='speed'),cr=D.events.filter(e=>e.type==='crash'),outs=D.events.filter(e=>e.type==='out'),walls=D.events.filter(e=>e.type==='wall');
const Rt=tt=>{let r=R;for(const k of (D.kos||[]))r-=(D.SHR||0)*R*cl((tt-k)/(D.SHT||1));return r};
function countAt(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m}return lo}
const EMO=/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/u;
function txt(str,y,size,colr,a,cx=500,maxw=800,align='center'){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.textAlign='left';x.lineJoin='round';
 const parts=str.split(EMO).filter(p=>p);const f=(p,sz)=>EMO.test(p)?sz*.9+'px "Noto Color Emoji"':'900 '+sz+'px "DejaVu Sans",Arial,sans-serif';
 let sz=size,wd=()=>parts.reduce((s,p)=>{x.font=f(p,sz);return s+x.measureText(p).width},0),w=wd();if(w>maxw){sz=size*maxw/w;w=wd()}
 let px=align==='center'?cx-w/2:cx;parts.forEach(p=>{x.font=f(p,sz);if(!EMO.test(p)){x.lineWidth=sz/5;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(p,px,y);x.fillStyle=colr;x.fillText(p,px,y)}else{x.fillStyle='#fff';x.fillText(p,px,y)}px+=x.measureText(p).width});x.restore()}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,CY,40,CX,CY,1200);rg.addColorStop(0,BG[0]);rg.addColorStop(.5,BG[1]);rg.addColorStop(1,BG[2]);g.fillStyle=rg;g.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${.03+.05*((i*37)%7)/7})`;g.beginPath();g.arc((i*7919)%W,(i*104729)%H,1+(i%3)*.6,0,7);g.fill()}
 const fl=g.createLinearGradient(0,1560,0,H);fl.addColorStop(0,'rgba(80,90,180,0)');fl.addColorStop(1,'rgba(80,90,180,.10)');g.fillStyle=fl;g.fillRect(0,1560,W,H-1560)}
function ball(i,bx,by,r,sqx,sqy,sq,al,hp,flash){x.save();x.globalAlpha=al;x.translate(bx,by);
 if(sq>0){const a=Math.atan2(sqy,sqx);x.rotate(a);x.scale(1-sq,1+sq*.6);x.rotate(-a)}
 x.shadowColor=col(i,60);x.shadowBlur=24;const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);g.addColorStop(0,col(i,88));g.addColorStop(.45,col(i,54));g.addColorStop(1,col(i,24));
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;
 if(flash>0){x.fillStyle=`rgba(255,255,255,${.55*flash})`;x.beginPath();x.arc(0,0,r,0,7);x.fill()}
 x.fillStyle='rgba(255,255,255,.75)';x.beginPath();x.ellipse(-r*.38,-r*.44,r*.25,r*.15,-.6,0,7);x.fill();
 if(hp!=null){x.textAlign='center';x.textBaseline='middle';x.font=`900 ${Math.round(r*1.0)}px "DejaVu Sans"`;x.lineJoin='round';x.lineWidth=r*.16;x.strokeStyle='rgba(6,4,20,.85)';x.strokeText(hp,0,r*.06);x.fillStyle='#fff';x.fillText(hp,0,r*.06)}
 x.restore()}
function draw(tv){
 const VF=D.vfps||30,t=D.tmap[Math.min(D.tmap.length-1,Math.max(0,Math.round(tv*VF)))],FF=D.ffps,ff=Math.min(D.frames.length-1,Math.max(0,t*FF-1)) /* frames[k] = sim time (k+1)/FF */,f=Math.round(ff),f0=Math.floor(ff),f1=Math.min(D.frames.length-1,f0+1),u=ff-f0;
 const evIn=i=>D.events.some(e=>e.t>(f0+1)/FF&&e.t<=(f1+1)/FF&&(e.ball===i||e.a===i||e.b===i));
 const PP=[0,1,2,3].map(i=>{const A0=D.frames[f0][i],A1=D.frames[f1][i];if(A0[3]===A1[3]&&!evIn(i))return[A0[0]+(A1[0]-A0[0])*u,A0[1]+(A1[1]-A0[1])*u,A0[2]+(A1[2]-A0[2])*u,A0[3]];return D.frames[f][i]});
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;x.filter='none';x.drawImage(bg,0,0);
 const tq=t+.5/FF,er=t>=ET?t-ET:-1;
 const nc=countAt(cr,tq),lastC=nc>0?cr[nc-1]:null,pulse=lastC?Math.max(0,1-(t-lastC.t)/.18):0;
 // camera: zoom so the shrinking arena keeps filling the frame (the physics is unchanged; only the view scales)
 const Z=R/Rt(t),SX=v=>CX+(v-CX)*Z,SY=v=>CY+(v-CY)*Z;x.save();x.translate(CX,CY);x.scale(Z,Z);x.translate(-CX,-CY);
 // arena ring (closed)
 const glowGold=er>=0?Math.exp(-er*1.3):0;
 x.save();x.lineWidth=HT*2;x.strokeStyle=er>=0?`hsl(45,100%,${62+20*glowGold}%)`:`hsl(${HUE},95%,${62+16*pulse}%)`;x.shadowColor=er>=0?'hsl(45,100%,60%)':`hsl(${HUE},100%,60%)`;x.shadowBlur=22+18*pulse+40*glowGold;
 const RR=Rt(t);x.beginPath();x.arc(CX,CY,RR,0,Math.PI*2);x.stroke();x.restore();
 // wall ripples (soft, fade fast)
 for(let k=countAt(walls,tq)-1;k>=0&&t-walls[k].t<.3;k--){const w=walls[k],q=(t-w.t)/.3;x.save();x.globalAlpha=.45*(1-q);x.strokeStyle=col(w.ball,75);x.lineWidth=3*(1-q)+1;x.beginPath();x.arc(w.x,w.y,5+18*ease(q),0,7);x.stroke();x.restore()}
 const koL=[];
 // knock-outs: pop burst in the loser colour + OUT!
 for(const o of outs){const s=t-o.t;if(s<0||s>1.4)continue;const k=s/1.4,fin=o.t===ET;x.save();x.beginPath();x.arc(CX,CY,RR-HT,0,7);x.clip();x.shadowColor=fin?'#ffd23f':col(o.ball,60);x.shadowBlur=12;
  for(let i=0;i<(fin?44:30);i++){const a=i*2.39996,h=((i*37)%11)/10,sp=200+380*h,rr=o.r+sp*s,px=o.x+Math.cos(a)*rr,py=o.y+Math.sin(a)*rr+300*s*s;x.globalAlpha=Math.max(0,1-k)*.95;x.fillStyle=i%3===0?'#fff':i%3===1&&fin?'#ffd23f':col(o.ball,62);x.beginPath();x.arc(px,py,8*(1-k)+2.5,0,7);x.fill()}x.restore();
  if(s<.35){const g2=x.createRadialGradient(o.x,o.y,0,o.x,o.y,200);g2.addColorStop(0,`hsla(${HUES[o.ball]},100%,75%,${.5*(1-s/.35)})`);g2.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g2;x.fillRect(o.x-200,o.y-200,400,400)}
  koL.push([o,s])}
 // trails then balls (dead balls are gone)
 for(let i=0;i<4;i++){if(PP[i][3]<=0)continue;for(let k=5;k>=1;k--){const p=D.frames[Math.max(0,f-2*k)][i];if(p[3]<=0)continue;x.save();x.globalAlpha=.08*(6-k)/5;x.fillStyle=col(i,60);x.beginPath();x.arc(p[0],p[1],p[2]*(1-.06*k),0,7);x.fill();x.restore()}}
 const lastHit=i=>{for(let k=nc-1;k>=0&&t-cr[k].t<.3;k--)if(cr[k].a===i||cr[k].b===i)return cr[k];return null};
 for(let i=0;i<4;i++){const p=PP[i];if(p[3]<=0)continue;const h=lastHit(i),since=h?t-h.t:9,sq=since<.12?.09*Math.sin(Math.PI*since/.12):0,nx=h?(h.x-p[0]):0,ny=h?(h.y-p[1]):1;
  if(er>=0&&i===WIN){const a=ease(er/.6);x.save();x.globalAlpha=.55*a;const g3=x.createRadialGradient(p[0],p[1],p[2]*.8,p[0],p[1],p[2]*2.2);g3.addColorStop(0,'rgba(255,215,90,.9)');g3.addColorStop(1,'rgba(255,215,90,0)');x.fillStyle=g3;x.beginPath();x.arc(p[0],p[1],p[2]*2.2,0,7);x.fill();x.restore()}
  const fl=h&&h.loser===i&&since<.22?1-since/.22:0;ball(i,p[0],p[1],p[2],nx,ny,sq,1,p[3],fl)}
 // crash sparks + floating -1 over the loser
 const minus=[];
 for(let k=nc-1;k>=0&&t-cr[k].t<.75;k--){const e=cr[k],s=t-e.t;
  if(s<.25){const q=s/.25;x.save();x.globalAlpha=.85*(1-q);x.strokeStyle='#fff';x.lineWidth=3;for(let j=0;j<8;j++){const a=j*.785+k,r0=8+40*ease(q),r1=r0+14*(1-q);x.beginPath();x.moveTo(e.x+Math.cos(a)*r0,e.y+Math.sin(a)*r0);x.lineTo(e.x+Math.cos(a)*r1,e.y+Math.sin(a)*r1);x.stroke()}x.restore()}
  if(e.hp>0)minus.push([e,s])}
 x.restore();
 // screen-space labels (drawn above the balls, never scaled): -1 over the loser, KO label in a fixed slot inside the top of the ring
 for(const [e,s] of minus){const p=PP[e.loser];txt('-1',Math.max(700,SY(p[1])-p[2]*Z-16-60*ease(s/.75)),46,col(e.loser,70),s<.5?1:1-(s-.5)/.25,SX(p[0]),200)}
 for(const [o,s] of koL){const sc=1+.3*Math.exp(-s*6);txt(NAMES[o.ball]+' OUT!',CY-R+HT+150,58*sc,col(o.ball,72),s<1?1:1-(s-1)/.4,CX,440)}
 for(const e of spd){const s=t-e.t-.3;if(s<0||s>1.5)continue;const sc=1+.35*Math.exp(-s*7);txt(`SPEED +${Math.round(SU*100)}% ⚡`,CY-R+HT+222,48*sc,'#ffd23f',s<1.1?ease(s/.12):1-(s-1.1)/.4,CX,440)}
 if(er>=0&&er<.25){x.fillStyle=`rgba(255,240,200,${.05*(1-er/.25)})`;x.fillRect(0,0,W,H)}
 const vg=x.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 // top panel: hook + rule + health rows
 x.save();x.fillStyle='rgba(8,8,30,.84)';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.roundRect(70,322,860,300,30);x.fill();x.stroke();x.restore();
 const lv=countAt(spd,t);
 if(er<0){txt(GAME?`Game ${GAME} · Pick a color 👇`:'Pick a color 👇 Who survives?',385,54*(1+.18*Math.exp(-tv*7)),'#fff',1);
  if(LW>=0&&tv<3.4){const a=tv<3?1:1-(tv-3)/.4;txt(`Last winner: ${NAMES[LW]} 👑 Can it win again?`,437,38,'#ffd23f',a)}
  else txt(lv>0?`Slower ball loses 1 HP · Speed +${Math.round((Math.pow(1+SU,lv)-1)*100)}%`:'Every crash: the SLOWER ball loses 1 HP',437,38,'#ffd23f',LW>=0?ease((tv-3.4)/.3):1)}
 else{const s=1+.22*Math.exp(-er*5);txt(NAMES[WIN]+(LW===WIN?' WINS AGAIN! 🏆':LW>=0?' IS THE NEW CHAMP! 👑':' SURVIVES! 🏆'),390,60*s,'#ffd23f',1);if(er>=.8)txt('Did your color win? 💬',446,40,'#fff',ease((er-.8)/.35))}
 for(let i=0;i<4;i++){const cx0=i%2?505:95,y0=478+Math.floor(i/2)*64,hp=PP[i][3],dead=hp<=0,h=lastHit(i),hit=h&&h.loser===i?t-h.t:9,pp=hit<.2?1-hit/.2:0;
  x.save();x.globalAlpha=dead?.38:1;ball(i,cx0+22,y0+18,17,0,1,0,1,null,0);if(i===LW&&er<0){x.font='20px "Noto Color Emoji"';x.textAlign='center';x.fillText('👑',cx0+22,y0+5)}
  x.textAlign='left';x.lineJoin='round';x.font='900 28px "DejaVu Sans"';x.lineWidth=7;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(NAMES[i],cx0+50,y0+30);x.fillStyle=col(i,72);x.fillText(NAMES[i],cx0+50,y0+30);
  const bx=cx0+196,bw=198,by=y0+5,bh=26,gw=(bw-(HP0-1)*4)/HP0;
  if(!dead)for(let k=0;k<HP0;k++){const on=k<hp;x.fillStyle=on?col(i,56):'rgba(255,255,255,.12)';if(on){x.shadowColor=col(i,60);x.shadowBlur=8}else x.shadowBlur=0;x.beginPath();x.roundRect(bx+k*(gw+4),by,gw,bh,6);x.fill()}
  x.shadowBlur=0;if(pp>0&&!dead&&h.hp>=0){x.fillStyle=`rgba(255,255,255,${.6*pp})`;x.beginPath();x.roundRect(bx+h.hp*(gw+4),by,gw,bh,6);x.fill()}
  x.restore();
  if(dead){txt('OUT',y0+30,30,'#fff',.85,cx0+290,200)}
  }

 // FOLLOW CALL (main goal, 8 Nov): small pill inside the arena for the last FOLLOWS seconds, then the loop cuts back to frame 0
 {const DUR=D.tmap.length/(D.vfps||30),FS=D.follows||1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=D.followY||(CY+200);x.save();x.globalAlpha=.45*fa;x.fillStyle='#05030c';x.beginPath();x.arc(CX,CY,R-HT,0,7);x.fill();x.restore();x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.88)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-280,PY-46,560,70,35);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → next one tomorrow',PY+3,38,'#ffd23f',fa,CX,520)}}
 return c.toDataURL('image/jpeg',0.93)}
window.draw=draw;
</script>

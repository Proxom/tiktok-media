const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};

function smooth(t,k){let sx=0,sy=0,n=0;for(let d=-k;d<=k;d++){const f=fr(t+d/FPS);sx+=f[0];sy+=f[1];n++}return[sx/n,sy/n]}
const hitIdx=D.hits.map(h=>h.id);
function render3d(t){
 const f=fr(t);ball.position.set(f[0]*S,-f[1]*S,.17);ball.rotation.z=-f[2];core.rotation.y=f[2]*.6;
 // bells wobble when hit
 D.hits.forEach(h=>{if(h.kind!=='bell'&&h.kind!=='pin')return;const dt=t-h.t;const m=pieceMesh[h.id];if(!m.userData.z0)m.userData.z0=m.position.z;

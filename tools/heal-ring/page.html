<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script><script>
// "The wall HEALS" renderer: 3 nested rotating brick rings, bricks crack (HP), break into holes and grow back (progress arc),
// ring shatters when the ball gets through, glossy ball with trail, HITS counter = logged hit events, WALL n of 3.
const W=1080,H=1920,D=DATA,BG=D.bg||['#1a1640','#0b0a26','#03030b'],CX=D.CX,CY=D.CY,HT=D.HT,ET=D.escT,FF=D.ffps,TAU=Math.PI*2;
const HUES=D.hues||[190,275,330],c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};
const hits=D.events.filter(e=>e.type==='hit'),rings=D.events.filter(e=>e.type==='ring'),esc=D.events.find(e=>e.type==='escape');
function countAt(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m}return lo}
const EMO=/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/u;
function txt(str,y,size,col,a,cx=500,maxw=800){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.textAlign='left';x.lineJoin='round';
 const parts=str.split(EMO).filter(p=>p);const f=(p,sz)=>EMO.test(p)?sz*.9+'px "Noto Color Emoji"':'900 '+sz+'px "DejaVu Sans",Arial,sans-serif';
 let sz=size,wd=()=>parts.reduce((s,p)=>{x.font=f(p,sz);return s+x.measureText(p).width},0),w=wd();if(w>maxw){sz=size*maxw/w;w=wd()}
 let px=cx-w/2;parts.forEach(p=>{x.font=f(p,sz);if(!EMO.test(p)){x.lineWidth=sz/5;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(p,px,y);x.fillStyle=col;x.fillText(p,px,y)}else{x.fillStyle='#fff';x.fillText(p,px,y)}px+=x.measureText(p).width});x.restore()}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,CY,40,CX,CY,1200);rg.addColorStop(0,BG[0]);rg.addColorStop(.5,BG[1]);rg.addColorStop(1,BG[2]);g.fillStyle=rg;g.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${.03+.05*((i*37)%7)/7})`;g.beginPath();g.arc((i*7919)%W,(i*104729)%H,1+(i%3)*.6,0,7);g.fill()}}
function sector(L,i,rot,pad){const w=TAU/D.NS[L],t1=rot+i*w+pad,t2=rot+(i+1)*w-pad,Ri=D.RS[L]-HT,Ro=D.RS[L]+HT;x.beginPath();x.arc(CX,CY,Ro,t1,t2);x.arc(CX,CY,Ri,t2,t1,true);x.closePath()}
// last break time of brick (L,i) at time t (for the regrow arc), last hit time (for the flash)
function lastEv(L,i,t,brk){for(let k=countAt(hits,t)-1;k>=0;k--){const h=hits[k];if(h.L===L&&h.i===i&&(!brk||h.brk))return h}return null}
function ball(bx,by,r,al){x.save();x.globalAlpha=al;x.translate(bx,by);x.shadowColor='#ffd23f';x.shadowBlur=26;
 const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);g.addColorStop(0,'#fff6c8');g.addColorStop(.45,'#ffc83a');g.addColorStop(1,'#a8560c');
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.ellipse(-r*.38,-r*.42,r*.27,r*.17,-.6,0,7);x.fill();x.restore()}
function draw(tv){
 const VF=D.vfps||60,t=D.tmap[Math.min(D.tmap.length-1,Math.max(0,Math.round(tv*VF)))],ff=Math.min(D.frames.length-1,Math.max(0,t*FF-1)) /* frames[k] = sim time (k+1)/FF */,
  f=Math.round(ff),f0=Math.floor(ff),f1=Math.min(D.frames.length-1,f0+1),u=ff-f0,A0=D.frames[f0],A1=D.frames[f1],
  fr=(!D.events.some(e=>e.t>(f0+1)/FF&&e.t<=(f1+1)/FF))?[A0[0]+(A1[0]-A0[0])*u,A0[1]+(A1[1]-A0[1])*u]:D.frames[f];
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;x.drawImage(bg,0,0);
 const tq=t+.5/FF,nh=countAt(hits,tq),nr=countAt(rings,tq),hpS=D.hpLog[f].split('|'),er=t>=ET?t-ET:-1,r=D.R0;
 // rings: shattered (fragments fly out), active (solid), waiting (dimmer, untouchable until it is the wall)
 for(let L=D.RS.length-1;L>=0;L--){const rot=D.a0[L]+D.OMS[L]*t,hue=HUES[L];
  if(L<nr){const re=rings[L],k=(t-re.t)/1.3;if(k<1){const rot0=re.rot;for(let i=0;i<D.NS[L];i++){const w=TAU/D.NS[L],am=rot0+(i+.5)*w,sp=260+180*((i*0.618)%1);
     x.save();x.globalAlpha=(1-k)*.9;x.translate(Math.cos(am)*sp*k*1.3,Math.sin(am)*sp*k*1.3+300*k*k);x.translate(CX,CY);x.rotate((i%2?1:-1)*k*1.5);x.translate(-CX,-CY);
     x.fillStyle=`hsl(${hue},95%,62%)`;x.shadowColor=`hsl(${hue},100%,60%)`;x.shadowBlur=14;sector(L,i,rot0,.03);x.fill();x.restore()}}
   continue}
  const act=L===nr,al=act?1:.42;
  for(let i=0;i<D.NS[L];i++){const hp=+hpS[L][i];
   if(hp===0){const lb=lastEv(L,i,tq,true),p=lb?cl((t-lb.t)/D.HEAL):0;x.save();x.globalAlpha=al;x.setLineDash([8,10]);x.strokeStyle=`hsla(${hue},80%,70%,.35)`;x.lineWidth=2;sector(L,i,rot,.03);x.stroke();x.setLineDash([]);
     /* regrow arc: grows along the hole as the heal timer runs */const w=TAU/D.NS[L],t1=rot+i*w+.03;x.strokeStyle=`hsla(${hue},100%,70%,${.35+.5*p})`;x.lineWidth=6;x.lineCap='round';x.beginPath();x.arc(CX,CY,D.RS[L],t1,t1+(w-.06)*p);x.stroke();x.restore();continue}
   const lh=lastEv(L,i,tq,false),fl=lh&&lh.hp>0?Math.max(0,1-(t-lh.t)/.18):0,dmg=1-hp/D.HPS[L];
   x.save();x.globalAlpha=al;const lit=act?60-22*dmg+30*fl:48;x.fillStyle=`hsl(${hue},${act?95-35*dmg:60}%,${lit}%)`;x.shadowColor=`hsl(${hue},100%,60%)`;x.shadowBlur=act?16+20*fl:0;sector(L,i,rot,.025);x.fill();x.shadowBlur=0;
   if(dmg>0){/* crack lines on a damaged brick */const w=TAU/D.NS[L],am=rot+(i+.5)*w;x.strokeStyle='rgba(10,6,30,.85)';x.lineWidth=3;x.beginPath();const R=D.RS[L];
     const P=(a,rr)=>[CX+Math.cos(a)*rr,CY+Math.sin(a)*rr];let q=P(am-.2*w,R-HT+2);x.moveTo(q[0],q[1]);q=P(am+.05*w,R-2);x.lineTo(q[0],q[1]);q=P(am-.1*w,R+HT-2);x.lineTo(q[0],q[1]);q=P(am+.05*w,R-2);x.moveTo(q[0],q[1]);q=P(am+.3*w,R+4);x.lineTo(q[0],q[1]);x.stroke()}
   // heal pop: white flash when the brick has just grown back
   x.restore()}
  // heal flashes
  D.events.forEach(e=>{if(e.type==='heal'&&e.L===L&&t>=e.t&&t-e.t<.3){x.save();x.globalAlpha=(1-(t-e.t)/.3)*.8*al;x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=20;sector(L,e.i,rot,.025);x.fill();x.restore()}})}
 // hit sparks + break debris
 for(let k=Math.max(0,nh-6);k<nh;k++){const h=hits[k],s=t-h.t;if(s<0||s>.5)continue;const kk=s/.5;x.save();x.globalAlpha=.8*(1-kk);x.strokeStyle='#fff';x.lineWidth=3*(1-kk)+1;x.beginPath();x.arc(h.x,h.y,8+34*ease(kk),0,7);x.stroke();
  if(h.brk){x.fillStyle=`hsl(${HUES[h.L]},100%,70%)`;for(let j=0;j<12;j++){const a=Math.atan2(h.y-CY,h.x-CX)+(j-5.5)*.22,sp=140+90*((j*.618)%1);x.beginPath();x.arc(h.x+Math.cos(a)*sp*s,h.y+Math.sin(a)*sp*s+260*s*s,6*(1-kk)+2,0,7);x.fill()}}x.restore()}
 // escape burst
 if(er>=0&&er<1.6){const k=er/1.6;x.save();x.shadowColor='#ffd23f';x.shadowBlur=16;for(let i=0;i<44;i++){const a=-Math.PI*(.06+.88*((i*0.618034)%1)),h=((i*37)%11)/10,sp=300+460*h,px=esc.x+Math.cos(a)*sp*er,py=esc.y+Math.sin(a)*sp*er+200*er*er;x.globalAlpha=Math.max(0,1-k)*.95;x.fillStyle=i%3?'#ffd23f':'#fff';x.beginPath();x.arc(px,py,10*(1-k)+2.5,0,7);x.fill()}x.restore();
  if(er<.6){const g2=x.createRadialGradient(esc.x,esc.y,0,esc.x,esc.y,280);g2.addColorStop(0,'rgba(255,220,120,'+(.5*(1-er/.6))+')');g2.addColorStop(1,'rgba(255,220,120,0)');x.fillStyle=g2;x.fillRect(esc.x-280,esc.y-280,560,560)}}
 // trail then ball (with a short squash after each hit)
 for(let k=5;k>=1;k--){const p=D.frames[Math.max(0,f-2*k)];x.save();x.globalAlpha=.10*(6-k)/5;x.fillStyle='#ffc83a';x.beginPath();x.arc(p[0],p[1],r*(1-.06*k),0,7);x.fill();x.restore()}
 ball(fr[0],fr[1],r,1);
 if(er>=0&&er<.25){x.fillStyle=`rgba(255,240,200,${.10*(1-er/.25)})`;x.fillRect(0,0,W,H)}
 const vg=x.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 // top panel: hook, rule, WALL n of 3 + HITS counter
 x.save();x.fillStyle='rgba(8,8,30,.84)';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.roundRect(70,322,860,290,30);x.fill();x.stroke();x.restore();
 const lr=nr>0?rings[nr-1]:null,rs=lr?tq-lr.t:9;
 if(er<0){txt('The wall HEALS itself 🩹',390,58,'#fff',1);
  if(lr&&rs<1.4){const s=1+.22*Math.exp(-rs*7);txt('WALL '+nr+' DOWN! 💥',448,Math.round(50*s),'#ff8a4a',1)}else txt('Can the ball break out? 👇',448,46,'#ffd23f',1);
  txt('2 hits make a hole. Holes grow back in '+D.HEAL+' s',500,30,'#cfd8ff',1)}
 else{const s=1+.25*Math.exp(-er*5);txt('BROKE OUT! 🎉',400,68*s,'#ffd23f',1);txt('after '+esc.n+' hits',466,46,'#fff',1)}
 const wn=Math.min(D.RS.length,nr+1),ph=hits.length&&nh>0&&tq-hits[nh-1].t<.16?1-(tq-hits[nh-1].t)/.16:0;
 x.save();x.textAlign='left';x.lineJoin='round';x.font='900 44px "DejaVu Sans"';x.lineWidth=9;x.strokeStyle='rgba(6,4,20,.92)';
 const wl=er>=0?'ALL 3 WALLS DOWN':'WALL '+wn+' of 3';x.strokeText(wl,110,570);x.fillStyle=er>=0?'#ffd23f':`hsl(${HUES[wn-1]},95%,72%)`;x.fillText(wl,110,570);
 x.textAlign='right';x.font=`900 ${Math.round(44*(1+.18*ph))}px "DejaVu Sans"`;const hl='HITS '+(er>=0?esc.n:nh);x.strokeText(hl,890,572);x.fillStyle='#fff';x.fillText(hl,890,572);x.restore();
 if(er>=1.0){const qa=ease((er-1.0)/.35);txt('How many hits',CY-70,80,'#fff',qa,CX,700);txt('did you guess? 💬',CY+30,80,'#fff',qa,CX,700)}
 // FOLLOW CALL: small pill in the lower part of the (now empty) arena for the last seconds, then the loop cuts back to frame 0
 {const DUR=D.tmap.length/VF,FS=D.follows||1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=D.followY||(CY+175);x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.86)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-310,PY-52,620,80,40);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → a new one every day',PY+4,44,'#ffd23f',fa,CX,570)}}
 return c.toDataURL('image/jpeg',0.93)}
window.draw=draw;
</script>

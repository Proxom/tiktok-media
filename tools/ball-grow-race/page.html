<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script><script>
// Colour race "Pick a colour" renderer (same look as format D ball-grow): violet background, neon ring with a rotating gap,
// three glossy balls (RED, BLUE, GREEN) with trails, squash and ripples; one truthful BALL vs GAP meter row per ball
// (2r / free gap width); the first ball out wins.
const W=1080,H=1920,D=DATA,HUE=D.hue??305,BG=D.bg||['#2c1446','#130a2a','#05030c'],CX=D.CX,CY=D.CY,R=D.R,HT=D.HT,ET=D.escT,WIN=D.win;
const NAMES=['RED','BLUE','GREEN'],HUES=[356,204,128],SAT=[95,95,85];
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};
const col=(i,l=58)=>`hsl(${HUES[i]},${SAT[i]}%,${l}%)`;
const bo=D.events.filter(e=>e.type==='bounce'),esc=D.events.find(e=>e.type==='escape');
const per=[0,1,2].map(i=>bo.filter(e=>e.ball===i));
function countAt(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m}return lo}
const EMO=/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/u;
function txt(str,y,size,colr,a,cx=500,maxw=800,align='center'){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.textAlign='left';x.lineJoin='round';
 const parts=str.split(EMO).filter(p=>p);const f=(p,sz)=>EMO.test(p)?sz*.9+'px "Noto Color Emoji"':'900 '+sz+'px "DejaVu Sans",Arial,sans-serif';
 let sz=size,wd=()=>parts.reduce((s,p)=>{x.font=f(p,sz);return s+x.measureText(p).width},0),w=wd();if(w>maxw){sz=size*maxw/w;w=wd()}
 let px=align==='center'?cx-w/2:cx;parts.forEach(p=>{x.font=f(p,sz);if(!EMO.test(p)){x.lineWidth=sz/5;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(p,px,y);x.fillStyle=colr;x.fillText(p,px,y)}else{x.fillStyle='#fff';x.fillText(p,px,y)}px+=x.measureText(p).width});x.restore()}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,CY,40,CX,CY,1200);rg.addColorStop(0,BG[0]);rg.addColorStop(.5,BG[1]);rg.addColorStop(1,BG[2]);g.fillStyle=rg;g.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${.03+.05*((i*37)%7)/7})`;g.beginPath();g.arc((i*7919)%W,(i*104729)%H,1+(i%3)*.6,0,7);g.fill()}
 const fl=g.createLinearGradient(0,1560,0,H);fl.addColorStop(0,'rgba(80,90,180,0)');fl.addColorStop(1,'rgba(80,90,180,.10)');g.fillStyle=fl;g.fillRect(0,1560,W,H-1560)}
function ball(i,bx,by,r,sqx,sqy,sq,al){x.save();x.globalAlpha=al;x.translate(bx,by);
 if(sq>0){const a=Math.atan2(sqy,sqx);x.rotate(a);x.scale(1-sq,1+sq*.6);x.rotate(-a)}
 x.shadowColor=col(i,60);x.shadowBlur=24;const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);g.addColorStop(0,col(i,88));g.addColorStop(.45,col(i,56));g.addColorStop(1,col(i,24));
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.8)';x.beginPath();x.ellipse(-r*.38,-r*.42,r*.27,r*.17,-.6,0,7);x.fill();x.restore()}
function draw(tv){
 const VF=D.vfps||30,t=D.tmap[Math.min(D.tmap.length-1,Math.max(0,Math.round(tv*VF)))],FF=D.ffps,ff=Math.min(D.frames.length-1,Math.max(0,t*FF)),f=Math.round(ff),f0=Math.floor(ff),f1=Math.min(D.frames.length-1,f0+1),u=ff-f0;
 const evIn=i=>D.events.some(e=>e.t>f0/FF&&e.t<=f1/FF&&(e.ball===i||e.a===i||e.b===i));
 const pos=i=>{const A0=D.frames[f0][i],A1=D.frames[f1][i];return(A0[3]===A1[3]&&!evIn(i))?[A0[0]+(A1[0]-A0[0])*u,A0[1]+(A1[1]-A0[1])*u,A0[2]+(A1[2]-A0[2])*u,A0[3]]:D.frames[f][i]};
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;x.filter='none';x.drawImage(bg,0,0);
 const tq=t+.5/FF,er=t>=ET?t-ET:-1;
 const nbAll=countAt(bo,tq),lastAll=nbAll>0?bo[nbAll-1]:null,pulse=lastAll?Math.max(0,1-(t-lastAll.t)/.16):0;
 // ring
 const gc=D.a0+D.OM*t,glowGold=er>=0?Math.exp(-er*1.3):0;
 x.save();x.lineCap='round';x.lineWidth=HT*2;
 x.strokeStyle=er>=0?`hsl(45,100%,${62+20*glowGold}%)`:`hsl(${HUE},95%,${62+18*pulse}%)`;x.shadowColor=er>=0?'hsl(45,100%,60%)':`hsl(${HUE},100%,60%)`;x.shadowBlur=22+20*pulse+40*glowGold;
 x.beginPath();x.arc(CX,CY,R,gc+D.GAP,gc-D.GAP+Math.PI*2);x.stroke();x.restore();
 const p1=[CX+R*Math.cos(gc-D.GAP),CY+R*Math.sin(gc-D.GAP)],p2=[CX+R*Math.cos(gc+D.GAP),CY+R*Math.sin(gc+D.GAP)];
 x.save();x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=14;[p1,p2].forEach(p=>{x.beginPath();x.arc(p[0],p[1],HT*.75,0,7);x.fill()});x.restore();
 const st=[0,1,2].map(i=>{const n=countAt(per[i],tq),lb=n>0?per[i][n-1]:null;return{lb,since:lb?t-lb.t:9,q:lb?lb.ratio:2*D.R0/D.CLEAR}});
 // ripples (fade fast, never left behind at an old cap position)
 for(let i=0;i<3;i++){const s=st[i];if(s.lb&&s.since<.3){const k=s.since/.3;x.save();x.globalAlpha=.6*(1-k);x.strokeStyle=col(i,75);x.lineWidth=3.5*(1-k)+1;x.beginPath();x.arc(s.lb.x,s.lb.y,6+22*ease(k),0,7);x.stroke();x.restore()}}
 // trails then balls
 for(let i=0;i<3;i++){for(let k=5;k>=1;k--){const p=D.frames[Math.max(0,f-2*k)][i];x.save();x.globalAlpha=.09*(6-k)/5*(er>=0&&i!==WIN?1-.6*ease(er/.8):1);x.fillStyle=col(i,60);x.beginPath();x.arc(p[0],p[1],p[2]*(1-.06*k),0,7);x.fill();x.restore()}}
 for(let i=0;i<3;i++){const s=st[i],fr=pos(i),sq=s.lb&&s.since<.12?.10*Math.sin(Math.PI*s.since/.12):0;ball(i,fr[0],fr[1],fr[2],s.lb?s.lb.nx:0,s.lb?s.lb.ny:1,sq,er>=0&&i!==WIN?1-.5*ease(er/.8):1)}
 // escape burst in the winner's colour + gold, drawn behind nothing important; the ball is redrawn on top
 if(er>=0&&er<1.6){const k=er/1.6;x.save();x.shadowColor='#ffd23f';x.shadowBlur=14;for(let i=0;i<44;i++){const a=i*2.39996,h=((i*37)%11)/10,sp=260+420*h,rr=esc.r+6+sp*er,px=esc.x+Math.cos(a)*rr,py=esc.y+Math.sin(a)*rr+380*er*er;x.globalAlpha=Math.max(0,1-k)*.95;x.fillStyle=i%3===0?'#fff':i%3===1?'#ffd23f':col(WIN,65);x.beginPath();x.arc(px,py,9*(1-k)+2.5,0,7);x.fill()}x.restore();
  if(er<.6){const g2=x.createRadialGradient(esc.x,esc.y,0,esc.x,esc.y,280);g2.addColorStop(0,'rgba(255,220,120,'+(.45*(1-er/.6))+')');g2.addColorStop(1,'rgba(255,220,120,0)');x.fillStyle=g2;x.fillRect(esc.x-280,esc.y-280,560,560)}
  const fr=pos(WIN);ball(WIN,fr[0],fr[1],fr[2],0,1,0,1)}
 if(er>=0&&er<.25){x.fillStyle=`rgba(255,240,200,${.08*(1-er/.25)})`;x.fillRect(0,0,W,H)}
 const vg=x.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 // top panel: hook + one meter row per ball
 x.save();x.fillStyle='rgba(8,8,30,.84)';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.roundRect(70,322,860,300,30);x.fill();x.stroke();x.restore();
 if(er<0){txt('Pick a color 👇 Who gets out first?',385,50,'#fff',1);txt('Every bounce = BIGGER · 100% = too big',437,40,'#ffd23f',1)}
 else{const s=1+.22*Math.exp(-er*5);txt(NAMES[WIN]+' ESCAPED FIRST! 🎉',405,58*s,'#ffd23f',1)}
 for(let i=0;i<3;i++){const y0=470+i*50,s=st[i],q=er>=0&&i===WIN?esc.ratio:s.q,pct=Math.round(q*100),pp=1+.14*(s.since<.16&&!(er>=0)?1-s.since/.16:0);
  const dim=er>=0&&i!==WIN?.55:1;x.save();x.globalAlpha=dim;
  ball(i,124,y0+18,15,0,1,0,1);
  x.textAlign='left';x.lineJoin='round';x.font='900 34px "DejaVu Sans"';x.lineWidth=7;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(NAMES[i],152,y0+31);x.fillStyle=col(i,72);x.fillText(NAMES[i],152,y0+31);
  const bx=300,bw=470,by=y0+4,bh=28;x.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.roundRect(bx,by,bw,bh,14);x.fill();
  x.fillStyle=col(i,56);x.shadowColor=col(i,60);x.shadowBlur=12;x.beginPath();x.roundRect(bx,by,Math.max(bh,bw*cl(q)),bh,14);x.fill();x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=2.5;x.beginPath();x.roundRect(bx,by,bw,bh,14);x.stroke();
  x.textAlign='right';x.font=`900 ${Math.round(40*pp)}px "DejaVu Sans"`;x.lineWidth=8;x.strokeText(pct+'%',892,y0+33);x.fillStyle='#fff';x.fillText(pct+'%',892,y0+33);x.restore();
  if(er>=0&&i===WIN)txt('🏆',y0+32,28,'#fff',1,258,40,'left')}
 if(er>=1.0)txt('Did your color win? 💬',CY+10,54,'#fff',ease((er-1.0)/.35),CX,680);
 return c.toDataURL('image/jpeg',0.93)}
window.draw=draw;
</script>

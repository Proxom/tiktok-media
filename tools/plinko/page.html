 D.PEGS.forEach((p,i)=>{const h=lastPeg[i],q=h?1-(t-h.t)/.25:0;x.save();x.shadowColor=q>0?'#fff':`hsl(${HUE},100%,70%)`;x.shadowBlur=10+18*q;x.fillStyle=q>0?`hsl(${HUE},${100-80*q}%,${78+20*q}%)`:`hsl(${HUE},90%,76%)`;

 {const uu=((t/D.P+D.ph)%1+1)%1,dxp=CX+D.AMP*(uu<.5?4*uu-1:3-4*uu);x.save();x.fillStyle='rgba(8,8,30,.9)';x.strokeStyle=`hsl(${HUE},95%,72%)`;x.shadowColor=`hsl(${HUE},100%,65%)`;x.shadowBlur=14;x.lineWidth=4;
  x.beginPath();x.roundRect(dxp-34,646,68,26,10);x.fill();x.stroke();x.restore();

  if(ci<0){for(let k=4;k>=1;k--){const pf=D.frames[Math.max(0,f0-2*k)][i];if(!pf)continue;x.save();x.globalAlpha=.07*(5-k);x.fillStyle='#dfe2ff';x.beginPath();x.arc(pf[0],pf[1],R*(1-.08*k),0,7);x.fill();x.restore()}}
  fr.push([lx,ly,ci,fl])}
 if(left===1&&er<0){const lb=D.events.filter(e=>e.type==='land').slice(-1)[0].ball,q=fr[lb];if(q){x.save();const g=x.createRadialGradient(q[0],q[1],R*.6,q[0],q[1],R*3.2);g.addColorStop(0,'rgba(255,215,90,.75)');g.addColorStop(1,'rgba(255,215,90,0)');x.fillStyle=g;x.beginPath();x.arc(q[0],q[1],R*3.2,0,7);x.fill();x.restore()}}

  txt(NAMES[i]+((er<0?i===LW:(LW>=0&&i===WIN&&er>=.5))?' 👑':''),514,30*(er>=.5&&i===WIN&&LW>=0?1+.25*Math.exp(-(er-.5)*6):1),col(i,72),1,cx0,170);  // crown hands over to the new/old champion 0.5 s after the end
  txt(String(cnt[i]),588,62*(1+.25*pp),'#fff',1,cx0,180);

 {const DUR=D.tmap.length/VF,FS=D.follows||1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=D.followY||1000;x.save();x.globalAlpha=.5*fa;x.fillStyle='#05030c';x.fillRect(XL,640,XR-XL,FL-640+14);x.restore();x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.88)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-270,PY-46,540,70,35);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → next one tomorrow',PY+3,38,'#ffd23f',fa,CX,500)}}

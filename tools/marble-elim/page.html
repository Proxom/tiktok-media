 D.PEGS.forEach((p,i)=>{const h=lastPeg[i],q=h?1-(t-h.t)/.25:0;x.save();x.shadowColor=q>0?'#fff':`hsl(${HUE},100%,70%)`;x.shadowBlur=10+18*q;x.fillStyle=q>0?`hsl(${HUE},${100-80*q}%,${78+20*q}%)`:`hsl(${HUE},90%,76%)`;x.beginPath();x.arc(p[0],p[1],PR+2.5*q,0,7);x.fill();x.restore()});

 // lift glass (behind)
 x.save();x.fillStyle='rgba(150,190,255,.07)';x.strokeStyle='rgba(170,200,255,.45)';x.lineWidth=3;x.beginPath();x.roundRect(D.LXL+2,646,D.LXR-D.LXL+2,712,16);x.fill();x.stroke();
 x.globalAlpha=.25;x.strokeStyle='#bcd2ff';x.lineWidth=3;for(let i=0;i<10;i++){const yy=1340-((i*72+t*260)%700);x.beginPath();x.moveTo(D.LX-9,yy+6);x.lineTo(D.LX,yy-3);x.lineTo(D.LX+9,yy+6);x.stroke()}x.restore();
 for(let ci=0;ci<N;ci++){const p=pos[ci];if(!p||p[2]!==0||er>=0&&ci!==WIN)continue;for(let q=4;q>=1;q--){const F=D.frames[Math.max(0,f0-2*q)],ii=D.order.indexOf(ci),pf=F[ii];if(!pf||pf[2]!==0)continue;x.save();x.globalAlpha=.06*(5-q);x.fillStyle=col(ci,70);x.beginPath();x.arc(pf[0],pf[1],R*(1-.08*q),0,7);x.fill();x.restore()}}
 for(const ci of danger){const p=pos[ci];x.save();x.globalAlpha=.55+.4*Math.sin(t*16);x.strokeStyle='#ff3b4d';x.shadowColor='#ff3b4d';x.shadowBlur=16;x.lineWidth=5;x.beginPath();x.arc(p[0],p[1],R+9,0,7);x.stroke();x.restore()}
 for(let ci=0;ci<N;ci++){const p=pos[ci];if(!p)continue;if(ci in outT&&outT[ci]<=t){const s=t-outT[ci];if(s<.9){const o=outs.find(e=>e.m===ci);  // pop: ring + shards + a cross floating up

  const lg=gates.filter(g=>g.m===ci&&g.t<=t).pop(),fl=lg&&t-lg.t<.25?1-(t-lg.t)/.25:0;ball(p[0],p[1],R,ci,1,fl)}

  if(er<2.4){const o=outs[outs.length-1];const gx=D.GX-30,gy=1300;x.save();x.beginPath();x.rect(D.XL-20,630,D.LXR-D.XL+40,800);x.clip();for(let i=0;i<80;i++){const a=-Math.PI/2+(((i*37)%23)/22-.5)*1.8,sp=520+560*((i*53)%17)/16,px=gx+Math.cos(a)*sp*er,py=gy+Math.sin(a)*sp*er+700*er*er;
   x.globalAlpha=Math.max(0,1-er/2.4);x.fillStyle=i%3===0?'#fff':i%3===1?'#ffd23f':col(WIN,64);x.save();x.translate(px,py);x.rotate(i+er*6);x.fillRect(-7,-4,14,8);x.restore()}x.restore()}}

 for(let ci=0;ci<N;ci++){const cx0=145+ci*142,isOut=ci in outT&&outT[ci]<=t,isW=er>=0&&ci===WIN,dg=danger.includes(ci);x.save();
  if(isW||dg){x.strokeStyle=isW?'rgba(255,210,63,.95)':'rgba(255,59,77,.9)';x.shadowColor=isW?'#ffd23f':'#ff3b4d';x.shadowBlur=14;x.lineWidth=4;x.beginPath();x.roundRect(cx0-64,478,128,124,20);x.stroke()}x.restore();
  ball(cx0,520,22,ci,isOut?.28:1,0);if(isOut){x.save();x.strokeStyle='rgba(255,70,80,.95)';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(cx0-18,502);x.lineTo(cx0+18,538);x.moveTo(cx0+18,502);x.lineTo(cx0-18,538);x.stroke();x.restore()}

 {const FS=1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=1000;x.save();x.globalAlpha=.5*fa;x.fillStyle='#05030c';x.fillRect(D.XL-10,636,D.LXR-D.XL+20,800);x.restore();

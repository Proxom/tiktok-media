<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="three.min.js"></script><script>
// Pendulum wave: 15 chrome balls, pendulum k swings (N0+k) times per CYCLE seconds, so all realign at t=CYCLE (perfect loop).
const W=1080,H=1920,CYCLE=20,N=15,N0=12,A0=0.42;
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H,false);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;r.outputColorSpace=THREE.SRGBColorSpace;
const s=new THREE.Scene();s.background=new THREE.Color(0x0d0f14);s.fog=new THREE.Fog(0x0d0f14,18,40);
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,100);
// studio env: softboxes for chrome reflections
const ec=document.createElement('canvas');ec.width=1024;ec.height=512;const g=ec.getContext('2d');
let gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#2a2f3a');gr.addColorStop(.5,'#11141b');gr.addColorStop(1,'#050608');g.fillStyle=gr;g.fillRect(0,0,1024,512);
g.fillStyle='#ffffff';g.fillRect(120,90,220,90);g.fillRect(640,70,160,120);g.fillStyle='#ffb27a';g.fillRect(430,150,90,60);g.fillStyle='#6fb6ff';g.fillRect(880,160,90,50);
const et=new THREE.CanvasTexture(ec);et.mapping=THREE.EquirectangularReflectionMapping;et.colorSpace=THREE.SRGBColorSpace;s.environment=et;
const key=new THREE.SpotLight(0xfff1e0,260,40,0.6,0.5,1.6);key.position.set(-3,9,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.radius=4;key.shadow.bias=-0.0004;s.add(key);
const rim=new THREE.PointLight(0x5aa8ff,40,30);rim.position.set(6,3,-6);s.add(rim);
const warm=new THREE.PointLight(0xff9a5a,25,30);warm.position.set(-6,2,-4);s.add(warm);
s.add(new THREE.AmbientLight(0xffffff,0.08));
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshPhysicalMaterial({color:0x14161c,roughness:.22,metalness:.0,clearcoat:.8,clearcoatRoughness:.15}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;s.add(floor);
// frame: brushed metal bar along z, on two posts
const TOP=1.75,SP=0.42,L0=-(N-1)/2*SP;
const metal=new THREE.MeshPhysicalMaterial({color:0x9aa0aa,metalness:1,roughness:.3});
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,N*SP+1.2,24),metal);bar.rotation.x=Math.PI/2;bar.position.set(0,TOP,0);bar.castShadow=true;s.add(bar);
[-1,1].forEach(sg=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,TOP,24),metal);p.position.set(0,TOP/2,sg*(N*SP/2+.6));p.castShadow=true;s.add(p);
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,.08,32),metal);b.position.set(0,.04,sg*(N*SP/2+.6));b.receiveShadow=b.castShadow=true;s.add(b)});
// pendulums
const g9=9.81,pend=[];
const ballG=new THREE.SphereGeometry(.17,48,32);
const hues=[...Array(N)].map((_,k)=>new THREE.Color().setHSL((0.95+0.75*k/N)%1,0.85,0.55));
for(let k=0;k<N;k++){
 const f=(N0+k)/CYCLE,len=g9/Math.pow(2*Math.PI*f,2); // physical length for that frequency
 const piv=new THREE.Group();piv.position.set(0,TOP,L0+k*SP);s.add(piv);
 const str=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,len,6),new THREE.MeshStandardMaterial({color:0xdddddd,roughness:.5}));str.position.y=-len/2;piv.add(str);
 const m=new THREE.MeshPhysicalMaterial({color:hues[k],metalness:.55,roughness:.12,clearcoat:1,clearcoatRoughness:.05});
 const b=new THREE.Mesh(ballG,m);b.position.y=-len;b.castShadow=true;piv.add(b);
 pend.push({piv,f,len});}
const ease=v=>{v=Math.min(1,Math.max(0,v));return v*v*(3-2*v)};
function render3d(t){
 for(const p of pend)p.piv.rotation.z=A0*Math.cos(2*Math.PI*p.f*t);
 // slow orbit loop: camera goes from side 3/4 view, rises to near top view mid-cycle (snake pattern), returns
 const u=0.5-0.5*Math.cos(2*Math.PI*t/CYCLE);
 const az=0.62-0.4*u, el=0.28+0.85*u, R=7.0-0.6*u;
 const tgt=new THREE.Vector3(0,TOP-0.55-0.5*u,0);
 cam.position.set(tgt.x+R*Math.cos(el)*Math.sin(az),tgt.y+R*Math.sin(el),tgt.z+R*Math.cos(el)*Math.cos(az));
 cam.position.x+=0.03*Math.sin(t*1.3);cam.position.y+=0.03*Math.sin(t*1.7);
 cam.lookAt(tgt);r.render(s,cam);}
const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
function txt(str,y,size,col,a){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.font='900 '+size+'px "DejaVu Sans",Arial,sans-serif';x.textAlign='center';x.lineJoin='round';
 str.split('\n').forEach((l,i)=>{const yy=y+i*size*1.15;x.lineWidth=size/5;x.strokeStyle='rgba(0,0,0,.85)';x.strokeText(l,W/2,yy);x.fillStyle=col;x.fillText(l,W/2,yy)});x.restore()}
function frame(t){
 render3d(t);x.clearRect(0,0,W,H);x.drawImage(r.domElement,0,0);
 const vg=x.createRadialGradient(W/2,H*.5,H*.25,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 for(let n=0;n<1400;n++){const gx=Math.abs((Math.sin(n*12.9898+t*78.233)*43758.5453)%1),gy=Math.abs((Math.sin(n*78.233+t*12.9898)*12543.17)%1);x.fillStyle=n%2?'rgba(255,255,255,.04)':'rgba(0,0,0,.06)';x.fillRect(gx*W,gy*H,2,2)}
 const Y=290,fd=(a,b)=>ease((t-a)/.25)*(1-ease((t-b)/.25));
 txt('15 balls. Different\nstring lengths.',Y,80,'#fff',t<0.1?1:fd(-1,3.2));
 txt('Watch the pattern 👀',Y+40,82,'#ffd166',fd(3.4,7.6));
 txt('now it splits in two…',Y+40,76,'#fff',fd(9.0,11.6));
 txt('…and they line up\nagain in 3, 2, 1',Y,78,'#7ee0ff',fd(15.4,19.7));
 return o;}
function draw(t){return frame(t).toDataURL('image/jpeg',0.94)}
window.draw=draw;
</script>

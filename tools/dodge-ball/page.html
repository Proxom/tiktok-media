<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script><script>
// 1M+ #6 "1 vs 10" renderer: account look (violet background, neon ring, glossy balls, top panel with hook + live counters).
// Every number on screen is read from the sim: timer = sim time until the catch, CHASERS = 'enter' events, DODGES = 'dodge' events.
const W=1080,H=1920,D=DATA,CX=D.CX,CY=D.CY,R=D.R,HT=D.HT,ET=D.endT,RR=D.RR,RC=D.RC,NC=D.NC,HUE=305;
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};
const GOLD=l=>`hsl(46,100%,${l}%)`,RED=l=>`hsl(356,92%,${l}%)`;
const ent=D.events.filter(e=>e.type==='enter'),dod=D.events.filter(e=>e.type==='dodge'),bmp=D.events.filter(e=>e.type==='bump'),cat=D.events.find(e=>e.type==='catch');
function countAt(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m}return lo}
const EMO=/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/u;
function txt(str,y,size,colr,a,cx=CX,maxw=800,align='center'){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.textAlign='left';x.lineJoin='round';
 const parts=str.split(EMO).filter(p=>p);const f=(p,sz)=>EMO.test(p)?sz*.9+'px "Noto Color Emoji"':'900 '+sz+'px "DejaVu Sans",Arial,sans-serif';
 let sz=size,wd=()=>parts.reduce((s,p)=>{x.font=f(p,sz);return s+x.measureText(p).width},0),w=wd();if(w>maxw){sz=size*maxw/w;w=wd()}
 let px=align==='center'?cx-w/2:cx;parts.forEach(p=>{x.font=f(p,sz);if(!EMO.test(p)){x.lineWidth=sz/5;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(p,px,y);x.fillStyle=colr;x.fillText(p,px,y)}else{x.fillStyle='#fff';x.fillText(p,px,y)}px+=x.measureText(p).width});x.restore()}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,CY,40,CX,CY,1200);rg.addColorStop(0,'#2c1446');rg.addColorStop(.5,'#130a2a');rg.addColorStop(1,'#05030c');g.fillStyle=rg;g.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${.03+.05*((i*37)%7)/7})`;g.beginPath();g.arc((i*7919)%W,(i*104729)%H,1+(i%3)*.6,0,7);g.fill()}}
function gloss(cf,bx,by,r,al,glow){x.save();x.globalAlpha=al;x.translate(bx,by);x.shadowColor=cf(60);x.shadowBlur=glow;const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);g.addColorStop(0,cf(88));g.addColorStop(.45,cf(54));g.addColorStop(1,cf(24));
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.ellipse(-r*.38,-r*.44,r*.25,r*.15,-.6,0,7);x.fill();x.restore()}
function eyes(bx,by,r,lx,ly,scared,angry){const l=Math.hypot(lx,ly)||1,ux=lx/l,uy=ly/l;for(const sd of [-1,1]){const ex=bx+sd*r*.36,ey=by-r*.08,er=r*(scared?.27:.22);
 x.fillStyle='#fff';x.beginPath();x.ellipse(ex,ey,er,er*(scared?1.15:1),0,0,7);x.fill();x.fillStyle='#120818';x.beginPath();x.arc(ex+ux*er*.45,ey+uy*er*.45,er*.5,0,7);x.fill();
 if(angry){x.strokeStyle='#2a0508';x.lineWidth=r*.13;x.lineCap='round';x.beginPath();x.moveTo(ex-sd*er*1.1,ey-er*1.45);x.lineTo(ex+sd*er*.9,ey-er*.85);x.stroke()}}}
function draw(tv){
 const VF=D.vfps||60,t=D.tmap[Math.min(D.tmap.length-1,Math.max(0,Math.round(tv*VF)))],FF=D.ffps,ff=Math.min(D.frames.length-1,Math.max(0,t*FF-1)),f0=Math.floor(ff),f1=Math.min(D.frames.length-1,f0+1),u=ff-f0;
 const F0=D.frames[f0],F1=D.frames[f1],L=(i)=>F0[i]+(F1[i]-F0[i])*u;
 const caught=t>=ET,er=caught?t-ET:-1,P=caught?[cat.px,cat.py]:[L(0),L(1)];
 const CH=[];for(let k=0;k<NC;k++){const on=F1[4+3*k]&&F0[4+3*k];CH.push(on?[L(2+3*k),L(3+3*k)]:F1[4+3*k]?[F1[2+3*k],F1[3+3*k]]:null)}
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;x.drawImage(bg,0,0);
 const ne=countAt(ent,t),nd=countAt(dod,t),lastD=nd?dod[nd-1]:null,ds=lastD?t-lastD.t:9;
 // arena ring
 const nb=countAt(bmp,t),lb=nb?bmp[nb-1]:null,pulse=lb?Math.max(0,1-(t-lb.t)/.18)*.6:0,cg=caught?Math.exp(-er*1.2):0;
 x.save();x.lineWidth=HT*2;x.strokeStyle=caught?`hsl(356,95%,${60+20*cg}%)`:`hsl(${HUE},95%,${62+16*pulse}%)`;x.shadowColor=caught?'hsl(356,100%,60%)':`hsl(${HUE},100%,60%)`;x.shadowBlur=22+18*pulse+40*cg;x.beginPath();x.arc(CX,CY,R,0,7);x.stroke();x.restore();
 // entry pops
 for(const e of ent){const s=t-e.t;if(s<0||s>.6)continue;const q=s/.6;x.save();x.globalAlpha=.8*(1-q);x.strokeStyle=RED(70);x.lineWidth=5*(1-q)+1;x.beginPath();x.arc(e.x,e.y,RC+50*ease(q),0,7);x.stroke();x.restore()}
 // runner trail
 if(!caught)for(let k=8;k>=1;k--){const g=D.frames[Math.max(0,f0-2*k)];x.save();x.globalAlpha=(ds<.5?.16:.07)*(9-k)/8;x.fillStyle=GOLD(60);x.beginPath();x.arc(g[0],g[1],RR*(1-.05*k),0,7);x.fill();x.restore()}
 // dodge burst (white ring + streaks)
 if(lastD&&ds<.45&&!caught){const q=ds/.45;x.save();x.globalAlpha=.85*(1-q);x.strokeStyle='#fff';x.lineWidth=4*(1-q)+1;x.beginPath();x.arc(lastD.x,lastD.y,RR+10+46*ease(q),0,7);x.stroke();x.restore()}
 // chasers
 let nearest=null,nd2=1e9;for(let k=0;k<NC;k++){const p=CH[k];if(!p)continue;const d=Math.hypot(p[0]-P[0],p[1]-P[1]);if(d<nd2){nd2=d;nearest=p}
  const s=t-ent[k].t,sc=s<.25?ease(s/.25):1,isC=caught&&k===D.catcher;
  if(isC){x.save();x.globalAlpha=.6;const g3=x.createRadialGradient(p[0],p[1],RC*.8,p[0],p[1],RC*2.4);g3.addColorStop(0,'rgba(255,80,90,.9)');g3.addColorStop(1,'rgba(255,80,90,0)');x.fillStyle=g3;x.beginPath();x.arc(p[0],p[1],RC*2.4,0,7);x.fill();x.restore()}
  gloss(RED,p[0],p[1],RC*sc,1,18);if(sc>.9){eyes(p[0],p[1]-RC*.12,RC,P[0]-p[0],P[1]-p[1],false,true);x.save();x.textAlign='center';x.textBaseline='middle';x.font=`900 ${Math.round(RC*.62)}px "DejaVu Sans"`;x.lineWidth=4;x.strokeStyle='rgba(30,4,8,.9)';x.strokeText(k+1,p[0],p[1]+RC*.5);x.fillStyle='#fff';x.fillText(k+1,p[0],p[1]+RC*.5);x.restore()}}
 // runner
 if(!caught||er<.05){gloss(GOLD,P[0],P[1],RR,1,ds<.3?40:24);if(ds<.2){x.save();x.globalAlpha=.5*(1-ds/.2);x.fillStyle='#fff';x.beginPath();x.arc(P[0],P[1],RR,0,7);x.fill();x.restore()}
  eyes(P[0],P[1],RR,nearest?nearest[0]-P[0]:0,nearest?nearest[1]-P[1]:1,nd2<RR+RC+120,false)}
 // catch: gold burst
 if(caught&&er<1.6){const k=er/1.6;x.save();x.beginPath();x.arc(CX,CY,R-HT,0,7);x.clip();x.shadowColor='#ffd23f';x.shadowBlur=12;for(let i=0;i<46;i++){const a=i*2.39996,h=((i*37)%11)/10,sp=220+400*h,rr=RR+sp*er,px=cat.px+Math.cos(a)*rr,py=cat.py+Math.sin(a)*rr+260*er*er;x.globalAlpha=Math.max(0,1-k)*.95;x.fillStyle=i%3===0?'#fff':i%3===1?'#ffd23f':RED(62);x.beginPath();x.arc(px,py,8*(1-k)+2.5,0,7);x.fill()}x.restore();
  if(er<.35){const g2=x.createRadialGradient(cat.px,cat.py,0,cat.px,cat.py,240);g2.addColorStop(0,`rgba(255,230,140,${.6*(1-er/.35)})`);g2.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g2;x.fillRect(cat.px-240,cat.py-240,480,480)}}
 // DODGE! label above the runner
 if(lastD&&ds<.7&&!caught){const a=ds<.5?1:1-(ds-.5)/.2,sc=1+.3*Math.exp(-ds*8);txt('DODGE!',Math.max(690,lastD.y-RR-34-40*ease(ds/.7)),40*sc,'#fff',a,cl(lastD.x,240,760),300)}
 if(caught&&er<.25){x.fillStyle=`rgba(255,240,200,${.07*(1-er/.25)})`;x.fillRect(0,0,W,H)}
 const vg=x.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 // top panel: hook + live counters
 x.save();x.fillStyle='rgba(8,8,30,.84)';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.roundRect(70,322,860,286,30);x.fill();x.stroke();x.restore();
 const tm=Math.min(t,ET);
 if(!caught){txt('1 vs 10 😬 How long does it last?',386,54*(1+.18*Math.exp(-tv*7)),'#fff',1);
  if(tv<3.6)txt('Guess the seconds before it starts 👇',440,36,'#ffd23f',tv<3.2?1:1-(tv-3.2)/.4);
  else{const pc=Math.round(100*(1+D.cgrow*t)*D.vc0/D.vr);txt(ne<NC?`A new chaser every ${D.ENT} s · Chasers speed up ⚡`:`ALL 10 IN! Chaser speed ${pc}% of yours`,440,34,'#ffd23f',ease((tv-3.6)/.3))}}
 else{const s=1+.22*Math.exp(-er*5);txt(`CAUGHT by #${D.catcher+1} 😵`,392,62*s,RED(70),1);if(er>=.7)txt(`It lasted ${ET.toFixed(1)} s · Did you guess it? 💬`,448,36,'#fff',ease((er-.7)/.35))}
 // counters row
 const ry=548;x.save();x.textAlign='center';
 txt(`⏱ ${tm.toFixed(1)} s`,ry,caught?58:52,caught?'#ffd23f':'#fff',1,270,330);
 txt(`CHASERS ${ne}/${NC}`,ry-6,34,RED(72),1,580,250);txt(`DODGES ${nd}`,ry-6,34,'#fff',1,815,200);x.restore();
 {const pc=cl((1+D.cgrow*t)*D.vc0/D.vr);x.save();x.fillStyle='rgba(255,255,255,.14)';x.beginPath();x.roundRect(470,ry+8,420,12,6);x.fill();x.fillStyle=RED(58);x.shadowColor=RED(60);x.shadowBlur=8;x.beginPath();x.roundRect(470,ry+8,420*pc,12,6);x.fill();x.restore()}
 // follow call, last FS seconds
 {const DUR=D.tmap.length/VF,FS=1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=cat.py>CY?CY-215:CY+200;x.save();x.globalAlpha=.45*fa;x.fillStyle='#05030c';x.beginPath();x.arc(CX,CY,R-HT,0,7);x.fill();x.restore();x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.88)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-320,PY-56,640,86,43);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → a new one every day',PY+4,46,'#ffd23f',fa,CX,590)}}
 return c.toDataURL('image/jpeg',0.93)}
window.draw=draw;
</script>

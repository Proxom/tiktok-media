<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id=c width=1080 height=1920></canvas><script src="data.js"></script><script>
// Sorting race: 4 real algorithms, same data, same speed (STEP comparisons per frame). 14 s.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920,FPS=30,STEP=3,GO=0.6,T=12.5;
const names=['BUBBLE','INSERTION','MERGE','QUICK'],cols=['#ff6b8a','#ffb454','#4cd4ff','#8b7bff'];
const len=names.map(n=>DATA.algos[n].length);const fin=len.map(l=>GO+(l-1)/STEP/FPS);
const order=[0,1,2,3].sort((a,b)=>fin[a]-fin[b]);const rank=[];order.forEach((k,i)=>rank[k]=i);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)},eob=v=>{v=cl(v);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
function txt(s,px,y,size,col,a,al){if(a<=0)return;x.save();x.globalAlpha=cl(a);x.font='900 '+size+'px "DejaVu Sans",Arial,sans-serif';x.textAlign=al||'center';x.lineJoin='round';
 s.split('\n').forEach((l,i)=>{const yy=y+i*size*1.15;x.lineWidth=size/5;x.strokeStyle='rgba(5,5,15,.9)';x.strokeText(l,px,yy);x.fillStyle=col;x.fillText(l,px,yy)});x.restore()}
function bg(t){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0d1d');g.addColorStop(1,'#151033');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<6;i++){const gx=W*(.2+.6*((i*.37+t*.02)%1)),gy=H*(.2+.12*i);const r=x.createRadialGradient(gx,gy,0,gx,gy,380);r.addColorStop(0,`hsla(${230+i*25},80%,60%,.10)`);r.addColorStop(1,'hsla(0,0%,0%,0)');x.fillStyle=r;x.fillRect(0,0,W,H)}}
const PY=470,PH=245,PG=22,PX=40,PW=1000;
function panel(k,t){
 const y=PY+k*(PH+PG);const step=t<GO?0:Math.min(len[k]-1,Math.floor((t-GO)*FPS*STEP));const st=DATA.algos[names[k]][step];const done=t>=fin[k];
 const intro=1;x.save();x.translate((1-intro)*-W,0);
 x.fillStyle='rgba(255,255,255,.06)';x.strokeStyle=done?cols[k]:'rgba(255,255,255,.14)';x.lineWidth=done?5:2;x.beginPath();x.roundRect(PX,y,PW,PH,28);x.fill();x.stroke();
 if(done){const a=Math.max(0,1-(t-fin[k])/.6);x.fillStyle=`rgba(255,255,255,${.25*a})`;x.beginPath();x.roundRect(PX,y,PW,PH,28);x.fill()}
 const N=DATA.N,bw=(PW-60)/N,base=y+PH-22,maxh=PH-80;
 for(let i=0;i<N;i++){const v=st.a[i],h=maxh*v/N,bx=PX+30+i*bw;const hl=!done&&st.h.includes(i);
  const g=x.createLinearGradient(bx,0,bx+bw,0);const col=hl?'#ffffff':`hsl(${(v/N)*280+200},85%,${done?62:55}%)`;g.addColorStop(0,col);g.addColorStop(.5,hl?'#fff':`hsl(${(v/N)*280+200},90%,72%)`);g.addColorStop(1,col);
  if(hl){x.save();x.shadowColor='#fff';x.shadowBlur=24}x.fillStyle=g;x.beginPath();x.roundRect(bx+2,base-h,bw-4,h,4);x.fill();if(hl)x.restore();}
 txt(names[k],PX+28,y+52,40,cols[k],1,'left');
 txt(step+' checks',PX+PW-28,y+50,30,'rgba(255,255,255,.75)',t>=GO?1:0,'right');
 if(done){const p=eob((t-fin[k])/.35);const lab=['🥇 1st','🥈 2nd','🥉 3rd','4th 🐢'][rank[k]];x.save();x.translate(PX+PW/2,y+PH/2-10);x.scale(p,p);x.fillStyle='rgba(8,8,20,.72)';x.beginPath();x.roundRect(-170,-50,340,100,50);x.fill();txt(lab,0,24,74,'#fff',1);x.restore()}
 x.restore();}
function draw(t){
 bg(t);for(let k=0;k<4;k++)panel(k,t);
 const Y=295;
 txt('Same data. Same speed.\nWho sorts it first? 👇',W/2,Y,64,'#fff',1-ease((t-fin[order[0]]+.25)/.2));
 if(t>=fin[order[0]]&&t<fin[order[2]]+.3)txt(names[order[0]]+' done in\n'+(len[order[0]]-1)+' checks ⚡',W/2,Y,70,cols[order[0]],ease((t-fin[order[0]])/.2)*(1-ease((t-fin[order[2]])/.3)));
 const last=order[3];
 if(t>=fin[order[2]]+.3&&t<fin[last])txt(names[last]+' is still\ngoing… 💀',W/2,Y,72,cols[last],ease((t-fin[order[2]]-.3)/.3));
 if(t>=fin[last]+.2){txt(names[order[0]]+' wins 🏆\nWho did you pick?',W/2,Y,70,'#fff',ease((t-fin[last]-.2)/.3))}
 return c.toDataURL('image/jpeg',0.93);}
window.draw=draw;
console.log(JSON.stringify({fin,order}));
</script>

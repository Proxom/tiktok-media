// GLITCH GUARD (lesson 1 Nov, marble-run): SwiftShader can render a ~2 ms window with a broken shadow pass. If the 3D luma
// jumps >12% vs the previous rendered time, re-render at t+-4 ms and keep the one closest to the previous luma.
const lc=document.createElement('canvas');lc.width=27;lc.height=48;const lg=lc.getContext('2d',{willReadFrequently:true});

  for(const dt of [.004,-.004,.008,-.008]){render3d(t+dt);const L2=luma3d();if(Math.abs(L2-lastL)<=.12*lastL){best=dt;L=L2;break}}

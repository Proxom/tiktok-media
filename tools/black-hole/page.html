<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script><script>
// "Black hole" renderer: account look (violet background, neon ring, glossy balls with eyes, top panel with hook + live counters).
// Every number on screen is read from the sim: LEFT = N - 'eat' events, HOLE SIZE = RH(t)/RH0, timer = sim time, winner = sim winner.
const W=1080,H=1920,D=DATA,CX=D.CX,CY=D.CY,R=D.R,HT=D.HT,RB=D.RB,N=D.N,ET=D.endT,HUE=305;
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};
const RHt=t=>{if(t>ET)t=ET;return D.RH0+(D.RH1-D.RH0)*cl(t/D.TG)};
const NAMES=['RED','BLUE','YELLOW','GREEN','PURPLE','ORANGE'],HU=[356,214,48,135,275,24],COL=i=>l=>`hsl(${HU[i]},${i===2?100:90}%,${l}%)`;
const eat=D.events.filter(e=>e.type==='eat'),hits=D.events.filter(e=>e.type==='wall'||e.type==='bump'),eatAt={};eat.forEach(e=>eatAt[e.b]=e);
function countAt(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m}return lo}
const EMO=/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/u;
function txt(str,y,size,colr,a,cx=CX,maxw=800,align='center'){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.textAlign='left';x.lineJoin='round';
 const parts=str.split(EMO).filter(p=>p);const f=(p,sz)=>EMO.test(p)?sz*.9+'px "Noto Color Emoji"':'900 '+sz+'px "DejaVu Sans",Arial,sans-serif';
 let sz=size,wd=()=>parts.reduce((s,p)=>{x.font=f(p,sz);return s+x.measureText(p).width},0),w=wd();if(w>maxw){sz=size*maxw/w;w=wd()}
 let px=align==='center'?cx-w/2:cx;parts.forEach(p=>{x.font=f(p,sz);if(!EMO.test(p)){x.lineWidth=sz/5;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(p,px,y);x.fillStyle=colr;x.fillText(p,px,y)}else{x.fillStyle='#fff';x.fillText(p,px,y)}px+=x.measureText(p).width});x.restore()}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,CY,40,CX,CY,1200);rg.addColorStop(0,'#2c1446');rg.addColorStop(.5,'#130a2a');rg.addColorStop(1,'#05030c');g.fillStyle=rg;g.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${.03+.05*((i*37)%7)/7})`;g.beginPath();g.arc((i*7919)%W,(i*104729)%H,1+(i%3)*.6,0,7);g.fill()}}
function gloss(cf,bx,by,r,al,glow){x.save();x.globalAlpha=al;x.translate(bx,by);x.shadowColor=cf(58);x.shadowBlur=glow;const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);g.addColorStop(0,cf(88));g.addColorStop(.45,cf(55));g.addColorStop(1,cf(25));
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.ellipse(-r*.38,-r*.44,r*.25,r*.15,-.6,0,7);x.fill();x.restore()}
function eyes(bx,by,r,lx,ly,scared){const l=Math.hypot(lx,ly)||1,ux=lx/l,uy=ly/l;for(const sd of [-1,1]){const ex=bx+sd*r*.36,ey=by-r*.08,er=r*(scared?.28:.22);
 x.fillStyle='#fff';x.beginPath();x.ellipse(ex,ey,er,er*(scared?1.15:1),0,0,7);x.fill();x.fillStyle='#120818';x.beginPath();x.arc(ex+ux*er*.45,ey+uy*er*.45,er*(scared?.42:.5),0,7);x.fill()}}
function hole(rh,t){// accretion glow + swirl + event horizon
 x.save();const g=x.createRadialGradient(CX,CY,rh*.9,CX,CY,rh*1.9+30);g.addColorStop(0,'rgba(255,170,70,.75)');g.addColorStop(.25,'rgba(255,90,140,.35)');g.addColorStop(1,'rgba(120,40,200,0)');x.fillStyle=g;x.beginPath();x.arc(CX,CY,rh*1.9+30,0,7);x.fill();
 x.translate(CX,CY);x.rotate(t*1.6);x.lineCap='round';for(let k=0;k<5;k++){x.rotate(6.283/5);x.strokeStyle=`rgba(255,${190-k*12},120,.5)`;x.lineWidth=3+rh*.03;x.beginPath();for(let s=0;s<=1;s+=.05){const rr=rh*(1.05+.75*s),a=-s*2.4;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.stroke()}
 x.restore();x.save();x.shadowColor='rgba(255,200,120,.9)';x.shadowBlur=26;x.strokeStyle='rgba(255,215,150,.95)';x.lineWidth=4;x.beginPath();x.arc(CX,CY,rh+2,0,7);x.stroke();x.shadowBlur=0;x.fillStyle='#000';x.beginPath();x.arc(CX,CY,rh,0,7);x.fill();x.restore()}
function draw(tv){
 const VF=D.vfps||60,t=D.tmap[Math.min(D.tmap.length-1,Math.max(0,Math.round(tv*VF)))],FF=D.ffps,ff=Math.min(D.frames.length-1,Math.max(0,t*FF-1)),f0=Math.floor(ff),f1=Math.min(D.frames.length-1,f0+1),u=ff-f0;
 const F0=D.frames[f0],F1=D.frames[f1],L=i=>F0[i]+(F1[i]-F0[i])*u;
 const won=t>=ET,er=won?t-ET:-1,RH=RHt(t),ne=countAt(eat,t),left=N-ne,lastE=ne?eat[ne-1]:null,es=lastE?t-lastE.t:9;
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.shadowBlur=0;x.drawImage(bg,0,0);
 // arena ring
 const nh=countAt(hits,t),lh=nh?hits[nh-1]:null,pulse=lh?Math.max(0,1-(t-lh.t)/.18)*.6:0;
 x.save();x.lineWidth=HT*2;x.strokeStyle=won?`hsl(46,100%,${62+18*Math.exp(-er*1.5)}%)`:`hsl(${HUE},95%,${62+16*pulse}%)`;x.shadowColor=won?'hsl(46,100%,60%)':`hsl(${HUE},100%,60%)`;x.shadowBlur=22+18*pulse;x.beginPath();x.arc(CX,CY,R,0,7);x.stroke();x.restore();
 // trails of live balls
 for(let k=0;k<N;k++){const e=eatAt[k];if(e&&t>=e.t)continue;x.save();x.strokeStyle=COL(k)(60);x.lineCap='round';for(let j=1;j<=14;j++){const a=D.frames[Math.max(0,f0-2*j+2)],b=D.frames[Math.max(0,f0-2*j)];x.globalAlpha=.32*(1-j/15);x.lineWidth=RB*.9*(1-j/16);x.beginPath();x.moveTo(a[3*k],a[3*k+1]);x.lineTo(b[3*k],b[3*k+1]);x.stroke()}x.restore()}
 // eaten balls spiral in (drawn under the horizon glow edge): shrink, stretch, fade
 for(let k=0;k<N;k++){const e=eatAt[k];if(!e||t<e.t)continue;const s=t-e.t;if(s>.9)continue;const q=ease(s/.9),px=L(3*k),py=L(3*k+1),a=Math.atan2(py-CY,px-CX);
  x.save();x.translate(px,py);x.rotate(a);x.scale(1+1.6*q,1-.6*q);x.translate(-px,-py);gloss(COL(k),px,py,RB*(1-.75*q),1-q,10);x.restore()}
 x.save();x.beginPath();x.arc(CX,CY,R-HT,0,7);x.clip();hole(RH,t);x.restore();
 // eat flash on the horizon
 for(const e of eat){const s=t-e.t;if(s<0||s>.6)continue;const q=s/.6,a=Math.atan2(e.y-CY,e.x-CX),rh=RHt(e.t);x.save();x.globalAlpha=.9*(1-q);x.strokeStyle=COL(e.b)(70);x.lineWidth=10*(1-q)+2;x.beginPath();x.arc(CX,CY,rh+6+30*q,a-.6-.6*q,a+.6+.6*q);x.stroke();x.restore()}
 // live balls
 for(let k=0;k<N;k++){const e=eatAt[k];if(e&&t>=e.t)continue;const px=L(3*k),py=L(3*k+1),isW=won&&k===D.win,dh=Math.hypot(px-CX,py-CY)-RB-RH;
  if(isW){x.save();x.globalAlpha=.7;const g3=x.createRadialGradient(px,py,RB*.8,px,py,RB*3);g3.addColorStop(0,'rgba(255,215,80,.9)');g3.addColorStop(1,'rgba(255,215,80,0)');x.fillStyle=g3;x.beginPath();x.arc(px,py,RB*3,0,7);x.fill();x.restore()}
  const sc=isW?1+.3*ease(er/.5):1;gloss(COL(k),px,py,RB*sc,1,16);eyes(px,py,RB*sc,CX-px,CY-py,dh<90&&!won);
  if(isW&&er>.2)txt('👑',py-RB*sc-24,64*ease((er-.2)/.3),'#fff',1,px,200)}
 // win confetti
 if(won&&er<2.2){const wp=[L(3*D.win),L(3*D.win+1)],k2=er/2.2;x.save();x.beginPath();x.arc(CX,CY,R-HT,0,7);x.clip();x.shadowColor='#ffd23f';x.shadowBlur=10;for(let i=0;i<54;i++){const a=i*2.39996,h=((i*37)%11)/10,rr=RB+(220+400*h)*er,px=wp[0]+Math.cos(a)*rr,py=wp[1]+Math.sin(a)*rr+280*er*er;x.globalAlpha=Math.max(0,1-k2)*.95;x.fillStyle=i%3===0?'#fff':i%3===1?'#ffd23f':COL(D.win)(62);x.beginPath();x.arc(px,py,7*(1-k2)+2.5,0,7);x.fill()}x.restore()}
 if(won&&er<.25){x.fillStyle=`rgba(255,240,200,${.07*(1-er/.25)})`;x.fillRect(0,0,W,H)}
 const vg=x.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 // top panel: hook + live counters
 x.save();x.fillStyle='rgba(8,8,30,.84)';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.roundRect(70,322,860,286,30);x.fill();x.stroke();x.restore();
 if(!won){txt('Who survives the black hole? 😱',386,56*(1+.18*Math.exp(-tv*7)),'#fff',1);
  if(tv<3.4)txt('Pick a color before it grows 👇',442,38,'#ffd23f',tv<3.0?1:1-(tv-3.0)/.4);
  else if(lastE&&es<1.3)txt(`${NAMES[lastE.b]} got eaten 😱`,442,40,COL(lastE.b)(68),es<1.0?1:1-(es-1.0)/.3);
  else txt(left===2?'FINAL 2 ⚔️ Who lasts longer?':'It grows every second · touch it = gone',442,left===2?40:34,left===2?'#ff6b81':'#ffd23f',1)}
 else{const s=1+.22*Math.exp(-er*5);txt(`${NAMES[D.win]} SURVIVES 👑`,394,64*s,COL(D.win)(66),1);txt(`Last of ${N} · Did you pick ${NAMES[D.win]}? 💬`,450,36,'#fff',ease((er-.1)/.25))}
 const ry=548;txt(`LEFT ${left}/${N}`,ry,left<=2?54:48,left<=2?'#ff6b81':'#fff',1,255,300);
 txt(`HOLE ×${(RH/D.RH0).toFixed(1)}`,ry-6,36,'hsl(32,100%,70%)',1,560,220);txt(`⏱ ${Math.min(t,ET).toFixed(1)} s`,ry-6,36,'#fff',1,790,190);
 // dots: who is still in
 for(let k=0;k<N;k++){const gone=eatAt[k]&&t>=eatAt[k].t,dx=470+k*70,dy=ry+20;x.save();x.globalAlpha=gone?.25:1;x.fillStyle=COL(k)(gone?30:58);x.beginPath();x.arc(dx+20,dy,11,0,7);x.fill();if(gone){x.strokeStyle='#ff6b81';x.lineWidth=4;x.beginPath();x.moveTo(dx+11,dy-9);x.lineTo(dx+29,dy+9);x.stroke()}x.restore()}
 // follow call, last FS seconds
 {const DUR=D.tmap.length/VF,FS=1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const wy=F1[3*D.win+1],PY=wy>CY?CY-250:CY+240;x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.88)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-320,PY-56,640,86,43);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → a new one every day',PY+4,46,'#ffd23f',fa,CX,590)}}
 return c.toDataURL('image/jpeg',0.93)}
window.draw=draw;
</script>

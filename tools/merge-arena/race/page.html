<script src="data.js"></script><script>
// Family E "Merge race" renderer (same account look as A/B/C/D: violet background, neon lines, glossy balls, top panel with hook + live counters).

const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,1030,40,CX,1030,1200);rg.addColorStop(0,BG[0]);rg.addColorStop(.5,BG[1]);rg.addColorStop(1,BG[2]);g.fillStyle=rg;g.fillRect(0,0,W,H);

 const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);x.shadowColor=col(ci,60);x.shadowBlur=12;g.addColorStop(0,col(ci,84));g.addColorStop(.45,col(ci,54));g.addColorStop(1,col(ci,24));

 if(k>=TOP){x.strokeStyle='#ffd23f';x.lineWidth=Math.max(5,r*.09);x.shadowColor='#ffd23f';x.shadowBlur=24;x.beginPath();x.arc(0,0,r-x.lineWidth/2,0,7);x.stroke();x.shadowBlur=0}

 else{const fs=r*(L.length>=2?.82:1.0);x.font='900 '+fs+'px "DejaVu Sans",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=fs*.16;x.strokeStyle='rgba(20,8,30,.75)';x.strokeText(L,0,fs*.05);x.fillStyle='#fff';x.fillText(L,0,fs*.05)}

function seg(x0,y0,x1,y1,w,cs,blur){x.save();x.lineCap='round';x.lineWidth=w;x.strokeStyle=cs;x.shadowColor=cs;x.shadowBlur=blur;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();x.restore()}
function draw(tv){

 seg(XL-4,640,XL-4,FL+4,8,`hsl(${HUE},95%,64%)`,20);seg(XR+4,640,XR+4,FL+4,8,`hsl(${HUE},95%,64%)`,20);seg(XL-4,FL+6,XR+4,FL+6,8,`hsl(${HUE},95%,64%)`,20);
 // dropper with the next ball inside it (position from the sim's dropper rule; next drop = next 'drop' event)
 {const uu=((t/D.P+D.ph)%1+1)%1,dxp=CX+D.AMP*(uu<.5?4*uu-1:3-4*uu);x.save();x.fillStyle='rgba(8,8,30,.9)';x.strokeStyle=`hsl(${HUE},95%,72%)`;x.shadowColor=`hsl(${HUE},100%,65%)`;x.shadowBlur=14;x.lineWidth=4;
  x.beginPath();x.roundRect(dxp-40,634,80,26,10);x.fill();x.stroke();x.restore();
  const nx=drops[countAt(drops,t)];if(nx&&er<0){const wait=nx.t-t,a=cl(1-wait/.12)*0+1;ball(dxp,DY_(),15,nx.c,nx.k,.95*outA,0,0)}}
 function DY_(){return 647}
 // balls
 const king=D.king,hold=[-1,-1,-1,-1];let kb=null;
 for(const a of F0){const b=F1.get(a[0])||a,bx=a[3]+(b[3]-a[3])*u,by=a[4]+(b[4]-a[4])*u,born=a[5],mg=mergedIds.has(a[0]),r=rAt(a[2],born,t,mg);hold[a[1]]=Math.max(hold[a[1]],a[2]);
  const fl=mg&&t-born<.22?1-(t-born)/.22:0,isK=a[0]===king.id;if(isK){kb=[bx,by,r];continue}
  ball(bx,by,r,a[1],a[2],outA*(er>=0?1-.35*cl(er/.6):1),fl,0)}
 // merge rings: a ring in the NEW owner's color (a takeover from another color gets a thicker ring)
 for(let k=countAt(merges,t)-1;k>=0&&t-merges[k].t<.4;k--){const e=merges[k],p=(t-e.t)/.4,q=F0.find(a=>a[0]===e.id),ex=q?q[3]:e.x,ey=q?q[4]:e.y,r=rad(e.k);
  x.save();x.globalAlpha=(1-p)*outA;x.strokeStyle=col(e.c,72);x.shadowColor=col(e.c,70);x.shadowBlur=16;x.lineWidth=(e.from!==e.c?9:5)*(1-p)+1;x.beginPath();x.arc(ex,ey,r*(1+.7*ease(p)),0,7);x.stroke();x.restore()}
 if(kb){const kg=er>=0?.6+.4*Math.sin(er*6):0,s=er>=0?1+.12*Math.exp(-er*3)*Math.sin(er*14):1;ball(kb[0],kb[1],kb[2]*s,WIN,TOP,outA,er>=0&&er<.25?1-er/.25:0,kg*outA)}
 // confetti from the king

   x.globalAlpha=Math.max(0,1-er/2.4)*outA;x.fillStyle=i%3===0?'#fff':i%3===1?'#ffd23f':col(WIN,64);x.save();x.translate(px,py);x.rotate(i+er*6);x.fillRect(-7,-4,14,8);x.restore()}x.restore()}
 if(er>=0&&er<.25){x.fillStyle=`rgba(255,240,200,${.06*(1-er/.25)})`;x.fillRect(0,0,W,H)}

 // top panel: hook + rule + live "biggest number each color holds"

 const m=Math.max(...hold),ls=hold.map((v,i)=>v===m&&m>=0?i:-1).filter(i=>i>=0),lead=ls.length===1?ls[0]:-1;

 const first64=merges.find(e=>e.k===TOP-1),f64=first64&&t>=first64.t&&t-first64.t<1.6&&duel.length<2;

 function panelText(st,al){if(al<=0)return;const E=st?-1:er,HO=st?[-1,-1,-1,-1]:hold,LD=st?-1:lead,TV=st?0:tv;

   else if(!st&&f64)txt(`${NAMES[first64.c]} hits 64! 👀 64 + 64 = 👑`,437,38*(1+.12*Math.exp(-(t-first64.t)*6)),'#ffd23f',al);
   else txt(TV<4.2?'Same numbers merge · newest color takes it':'64 + 64 = 👑 · first color to make it wins',437,TV<4.2?34:36,'#ffd23f',al*(TV<4.2?1:ease((TV-4.2)/.3)))}
  else{const s=1+.22*Math.exp(-E*5);txt(NAMES[WIN]+' WINS THE 👑!',390,60*s,'#ffd23f',al);txt(E>=1.6?'Did your color win? 💬':(D.king.lose!==WIN?`64 + 64 = 👑 · stolen from ${NAMES[D.king.lose]}!`:'64 + 64 = 👑'),446,38,'#fff',al*(E>=1.6?ease((E-1.6)/.35):1))}

 {const FS=D.follows||1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=1040;x.save();x.globalAlpha=.45*fa;x.fillStyle='#05030c';x.fillRect(XL,640,XR-XL,FL-640+14);x.restore();x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.88)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-270,PY-46,540,70,35);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → next one tomorrow',PY+3,38,'#ffd23f',fa,CX,500)}}

</script>

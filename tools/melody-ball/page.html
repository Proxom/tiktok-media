<!doctype html><meta charset=utf8><body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script><script>
// "Melody ball" renderer (same account look: violet background, neon ring, glossy ball, top panel with hook + live counter).
// The trail shows only the newest chords while the ball draws; when the last note has played, every chord lights up (the reveal).
const W=1080,H=1920,D=DATA,BG=['#2c1446','#130a2a','#05030c'],CX=D.CX,CY=D.CY,R=D.R,HT=D.HT,BR=D.BR,ET=D.endT,HI=D.hits,NN=HI.length;
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=v=>{v=cl(v);return v*v*(3-2*v)};
const hueK=k=>(285+k*(360/NN)*0.9)%360;
function countAt(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m}return lo}
const EMO=/(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/u;
function txt(str,y,size,colr,a,cx=500,maxw=800,align='center'){if(a<=0)return;x.save();x.globalAlpha=Math.min(1,a);x.textAlign='left';x.lineJoin='round';
 const parts=str.split(EMO).filter(p=>p);const f=(p,sz)=>EMO.test(p)?sz*.9+'px "Noto Color Emoji"':'900 '+sz+'px "DejaVu Sans",Arial,sans-serif';
 let sz=size,wd=()=>parts.reduce((s,p)=>{x.font=f(p,sz);return s+x.measureText(p).width},0),w=wd();if(w>maxw){sz=size*maxw/w;w=wd()}
 let px=align==='center'?cx-w/2:cx;parts.forEach(p=>{x.font=f(p,sz);if(!EMO.test(p)){x.lineWidth=sz/5;x.strokeStyle='rgba(6,4,20,.92)';x.strokeText(p,px,y);x.fillStyle=colr;x.fillText(p,px,y)}else{x.fillStyle='#fff';x.fillText(p,px,y)}px+=x.measureText(p).width});x.restore()}
const bg=document.createElement('canvas');bg.width=W;bg.height=H;{const g=bg.getContext('2d');const rg=g.createRadialGradient(CX,CY,40,CX,CY,1200);rg.addColorStop(0,BG[0]);rg.addColorStop(.5,BG[1]);rg.addColorStop(1,BG[2]);g.fillStyle=rg;g.fillRect(0,0,W,H);
 for(let i=0;i<160;i++){g.fillStyle=`rgba(255,255,255,${.03+.05*((i*37)%7)/7})`;g.beginPath();g.arc((i*7919)%W,(i*104729)%H,1+(i%3)*.6,0,7);g.fill()}}
// chord list: start point (first frame) -> hit 0 -> hit 1 ... -> hit NN-1
const PTS=[[D.frames[0][0],D.frames[0][1]],...HI.map(h=>[h.x,h.y])];
let FO=1;function chordLine(k,a,w,l=62){const p=PTS[k],q=PTS[k+1];x.save();x.globalAlpha=a*FO;x.strokeStyle=`hsl(${hueK(k)},95%,${l}%)`;x.lineWidth=w;x.lineCap='round';x.shadowColor=`hsl(${hueK(k)},100%,60%)`;x.shadowBlur=10;x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke();x.restore()}
function ball(bx,by,r,hue,al,sq,nx,ny){x.save();x.globalAlpha=al;x.translate(bx,by);if(sq>0){const a=Math.atan2(ny,nx);x.rotate(a);x.scale(1-sq,1+sq*.6);x.rotate(-a)}
 x.shadowColor=`hsl(${hue},100%,60%)`;x.shadowBlur=26;const g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);g.addColorStop(0,`hsl(${hue},90%,90%)`);g.addColorStop(.45,`hsl(${hue},90%,58%)`);g.addColorStop(1,`hsl(${hue},90%,26%)`);
 x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.75)';x.beginPath();x.ellipse(-r*.38,-r*.44,r*.25,r*.15,-.6,0,7);x.fill();x.restore()}
function draw(tv){
 const VF=D.vfps,DUR=D.tmap.length/VF,t=D.tmap[Math.min(D.tmap.length-1,Math.max(0,Math.round(tv*VF)))],ff=Math.min(D.frames.length-1,t*D.ffps),f0=Math.floor(ff),f1=Math.min(D.frames.length-1,f0+1),u=ff-f0;
 x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.drawImage(bg,0,0);
 const tq=t+.5/D.ffps,n=countAt(HI,tq),er=t>=ET?t-ET:-1,last=n?HI[n-1]:null,since=last?t-last.t:9,pulse=since<.2?1-since/.2:0;
 // ball position: interpolate inside a frame unless a hit happened in between (then use the exact hit point)
 let bx,by;{const A=D.frames[f0],B=D.frames[f1];const hb=HI.find(h=>h.t>f0/D.ffps&&h.t<=f1/D.ffps);
  if(!hb){bx=A[0]+(B[0]-A[0])*u;by=A[1]+(B[1]-A[1])*u}else{const th=(hb.t*D.ffps-f0);if(u<=th){const s=th>0?u/th:1;bx=A[0]+(hb.x-A[0])*s;by=A[1]+(hb.y-A[1])*s}else{const s=(u-th)/(1-th);bx=hb.x+(B[0]-hb.x)*s;by=hb.y+(B[1]-hb.y)*s}}}
 const hueNow=hueK(Math.max(0,n-1));
 // ring
 x.save();x.lineWidth=HT*2;const gl=er>=0?Math.exp(-er*1.2):0;x.strokeStyle=er>=0?`hsl(45,100%,${62+20*gl}%)`:`hsl(${hueNow},95%,${62+18*pulse}%)`;x.shadowColor=er>=0?'hsl(45,100%,60%)':`hsl(${hueNow},100%,60%)`;x.shadowBlur=22+20*pulse+40*gl;x.beginPath();x.arc(CX,CY,R,0,7);x.stroke();x.restore();
 // trail: newest 4 finished chords fade with age, plus the chord being drawn now
 if(er<0){for(let k=Math.max(0,n-3);k<n;k++){const age=n-k;chordLine(k,.75*(1-age/4),3.2)}
  if(n<=NN){const p=PTS[n];x.save();x.strokeStyle=`hsl(${hueK(n)},95%,66%)`;x.lineWidth=4;x.lineCap='round';x.shadowColor=`hsl(${hueK(n)},100%,60%)`;x.shadowBlur=12;x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(bx,by);x.stroke();x.restore()}}
 else{ // REVEAL: every chord lights up in drawing order over 1.2 s, then glows and turns slowly; it fades out in the last 0.35 s so the loop starts from the empty circle
  const rot=er>1.2?(er-1.2)*.12:0,fo=1-ease((tv-(DUR-.35))/.35);x.save();x.translate(CX,CY);x.rotate(rot);x.translate(-CX,-CY);FO=fo;
  const sweep=cl(er/1.2)*NN;for(let k=0;k<NN;k++){const a=cl(sweep-k);if(a<=0)continue;chordLine(k,.95*a,3.4,58+20*Math.exp(-Math.max(0,er-k*1.2/NN)*3))}
  if(er>1.2){x.save();x.globalAlpha=fo*.25*(.5+.5*Math.sin((er-1.2)*3));const g2=x.createRadialGradient(CX,CY,R*.2,CX,CY,R);g2.addColorStop(0,'rgba(255,215,90,.0)');g2.addColorStop(1,'rgba(255,215,90,.25)');x.fillStyle=g2;x.beginPath();x.arc(CX,CY,R,0,7);x.fill();x.restore()}x.restore();FO=1}
 // hit ripples + note pop
 for(let k=Math.max(0,n-3);k<n;k++){const h=HI[k],s=t-h.t;if(s>.45)continue;const q=s/.45;x.save();x.globalAlpha=.6*(1-q);x.strokeStyle=`hsl(${hueK(k)},95%,75%)`;x.lineWidth=3;x.beginPath();x.arc(h.x,h.y,BR+30*ease(q),0,7);x.stroke();x.restore();
  const nx=(h.x-CX),ny=(h.y-CY),dd=Math.hypot(nx,ny);txt('♪',h.y-ny/dd*70-30*ease(q),40,`hsl(${hueK(k)},95%,78%)`,1-q,h.x-nx/dd*70,80)}
 // ball (fades out at the reveal)
 {const al=er<0?1:1-ease(er/.4);if(al>0){const sq=since<.1?.12*Math.sin(Math.PI*since/.1):0;ball(bx,by,BR,hueNow,al,sq,last?last.x-CX:0,last?last.y-CY:1)}}
 const vg=x.createRadialGradient(W/2,H*.5,H*.3,W/2,H*.5,H*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=vg;x.fillRect(0,0,W,H);
 // top panel
 x.save();x.fillStyle='rgba(8,8,30,.84)';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.beginPath();x.roundRect(70,322,860,286,30);x.fill();x.stroke();x.restore();
 if(er<0){txt('Every bounce = the next note 🎵',385,52*(1+.16*Math.exp(-tv*7)),'#fff',1);txt('Guess what it draws 👇',446,50,'#ffd23f',1)}
 else{const s=1+.22*Math.exp(-er*5);txt(D.answer||'IT DREW A STAR FLOWER! ✨',388,56*s,'#ffd23f',1);txt(er>=1.6?'Name the song 🎵 💬':'Did you guess it? 👀',442,42,'#fff',1)}
 const sp=Math.round((Math.pow(D.SPD,Math.min(n,NN))-1)*100);  // the sim multiplies the speed by SPD after EVERY bounce, the last one too
 txt(`NOTE ${Math.min(n,NN)} / ${NN}`,540,58*(1+.18*pulse*(er<0)),'#fff',1,300,380);
 txt(`SPEED +${sp}%`,540,46,'#7fe3ff',1,700,320);
 txt(`+${Math.round((D.SPD-1)*100)}% per bounce`,592,32,'rgba(255,255,255,.8)',1,700,320);
 // progress bar under the note counter
 x.save();x.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.roundRect(130,566,340,16,8);x.fill();x.fillStyle=er>=0?'#ffd23f':`hsl(${hueNow},95%,62%)`;x.beginPath();x.roundRect(130,566,340*Math.min(n,NN)/NN,16,8);x.fill();x.restore();
 // FOLLOW CALL: pill over the dimmed circle for the last 1.4 s
 {const FS=1.4,fa=ease((tv-(DUR-FS))/.15);if(fa>0){const PY=CY+R*.62;x.save();x.globalAlpha=.4*fa;x.fillStyle='#05030c';x.beginPath();x.arc(CX,CY,R-HT,0,7);x.fill();x.restore();x.save();x.globalAlpha=fa;x.fillStyle='rgba(8,8,30,.9)';x.strokeStyle='rgba(255,210,63,.7)';x.lineWidth=3;x.beginPath();x.roundRect(CX-320,PY-56,640,86,43);x.fill();x.stroke();x.restore();txt(D.followText||'Follow → a new one every day',PY+4,44,'#ffd23f',fa,CX,590)}}
 return c.toDataURL('image/jpeg',0.93)}
window.draw=draw;
</script>
